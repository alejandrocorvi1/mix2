<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cyanBlueM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed 100% Background Rect -->
  <rect width="512" height="512" fill="url(#bgGradM)" />

  <!-- Inner Safe Zone Content -->
  <g transform="translate(256, 256) scale(0.95)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#cyanBlueM)" stroke-width="8" stroke-dasharray="16 10" opacity="0.6" />
    <circle cx="-75" cy="-50" r="20" fill="url(#cyanBlueM)" filter="url(#glowM)" />
    <circle cx="75" cy="50" r="20" fill="url(#cyanBlueM)" filter="url(#glowM)" />
    <line x1="-75" y1="-50" x2="75" y2="50" stroke="url(#cyanBlueM)" stroke-width="10" stroke-linecap="round" opacity="0.8" />
    <path d="M10 -80 L-45 8 L-4 8 L-18 80 L45 -8 L4 -8 Z" fill="url(#cyanBlueM)" filter="url(#glowM)" />
    <path d="M8 -70 L-38 8 L-4 8 L-16 70 L38 -8 L4 -8 Z" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
