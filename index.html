<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TwinLink - Compartir Archivos en Tiempo Real</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="PWA para compartir archivos temporales y mensajes en salas en tiempo real." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Apple iOS Mobile PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TwinLink" />
    <link rel="apple-touch-icon" href="/pwa-icon.jpg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-icon.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('SW registrado con éxito:', reg.scope),
            (err) => console.warn('Error al registrar SW:', err)
          );
        });
      }
    </script>
  </body>
</html>
